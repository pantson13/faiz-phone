<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FAIZ" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>FAIZ Phone (调尺寸版)</title>
<style>
  :root{
    --ui: url('assets/ui.jpg');

    /* ↓↓↓ 按钮整体更小：只要微调这几个百分比即可 ↓↓↓ */
    --enter-left: 28%;   /* ENTER 左边距（%） */
    --enter-top:  52.6%; /* ENTER 顶部（%）   */
    --enter-w:    23%;   /* ENTER 宽度（%）   */
    --enter-h:    4%;  /* ENTER 高度（%）   */

    /* =====================================================
       ENTER 下方 15 个按钮：每个按钮都可单独调整
       left = 左右位置；top = 上下位置；w = 宽度；h = 高度
       ===================================================== */

    /* 铃声 */
    --ring-left: 28%;
    --ring-top:  59%;
    --ring-w:    13%;
    --ring-h:    4.4%;

    /* クリア */
    --clear-left: 44.8%;
    --clear-top:  59%;
    --clear-w:    12%;
    --clear-h:    4.4%;

    /* 停止 */
    --stop-left: 60%;
    --stop-top:  59%;
    --stop-w:    13%;
    --stop-h:    4.4%;

    /* 数字 1 */
    --key1-left: 28%;
    --key1-top:  64.6%;
    --key1-w:    13%;
    --key1-h:    4.4%;

    /* 数字 2 */
    --key2-left: 44.8%;
    --key2-top:  64.6%;
    --key2-w:    12%;
    --key2-h:    4.4%;

    /* 数字 3 */
    --key3-left: 60%;
    --key3-top:  64.6%;
    --key3-w:    13%;
    --key3-h:    4.4%;

    /* 数字 4 */
    --key4-left: 28%;
    --key4-top:  70%;
    --key4-w:    13%;
    --key4-h:    4.3%;

    /* 数字 5 */
    --key5-left: 44.8%;
    --key5-top:  70%;
    --key5-w:    12%;
    --key5-h:    4.4%;

    /* 数字 6 */
    --key6-left: 60%;
    --key6-top:  70%;
    --key6-w:    13%;
    --key6-h:    4.4%;

    /* 数字 7 */
    --key7-left: 28%;
    --key7-top:  75.6%;
    --key7-w:    12%;
    --key7-h:    4.2%;

    /* 数字 8 */
    --key8-left: 44.6%;
    --key8-top:  75.6%;
    --key8-w:    12%;
    --key8-h:    4.2%;

    /* 数字 9 */
    --key9-left: 60%;
    --key9-top:  75.6%;
    --key9-w:    12%;
    --key9-h:    4.2%;

    /* 星号 */
    --star-left: 28%;
    --star-top:  81%;
    --star-w:    12%;
    --star-h:    4.2%;

    /* 数字 0 */
    --key0-left: 44%;
    --key0-top:  81%;
    --key0-w:    12%;
    --key0-h:    4.2%;

    /* 井号 */
    --hash-left: 60%;
    --hash-top:  81%;
    --hash-w:    12%;
    --hash-h:    4.2%;


    /* ===== FAIZ 顶部两个圆形按钮 ===== */
    --btn-top1-left: 4.2%;
    --btn-top1-top:  3%;
    --btn-top1-w:    18%;
    --btn-top1-h:    9%;

    /* TOP1 下方新增圆形按钮 */
    --btn-top1b-left: 4.2%;
    --btn-top1b-top:  14%;
    --btn-top1b-w:    18%;
    --btn-top1b-h:    9%;

    --btn-top2-left: 29%;
    --btn-top2-top:  3%;
    --btn-top2-w:    18%;
    --btn-top2-h:    9%;

    --btn-top3-left: 54.5%;
    --btn-top3-top:  3%;
    --btn-top3-w:    18%;
    --btn-top3-h:    9%;

    --btn-top4-left: 78.6%;
    --btn-top4-top:  3%;
    --btn-top4-w:    18%;
    --btn-top4-h:    9%;

    /* 第四个按钮对应弹框，与第一个弹框同尺寸 */
    --popup4-left: 6%;
    --popup4-top:  15%;
    --popup4-w:    88%;
    --popup4-h:    25%;

    /*
     * ===== TOP1 弹框：自适应 3 + 3 + 2 网格 =====
     *
     * 弹框宽度继续使用 88%。
     * 弹框高度不再写死，而是由按钮直径、三排按钮和上下间距
     * 在 placePopup1Grid() 中自动计算。
     *
     * 所有 POPUP1-BTN1～BTN8 使用完全相同的像素直径。
     */
    --popup1-left: 6%;
    --popup1-top:  15%;
    --popup1-w:    88%;

    /*
     * 按钮直径以弹框宽度为基准。
     * 20.45% 与原 POPUP1-BTN1 的宽度一致。
     */
    --popup1-grid-btn-size: 20.45%;

    /*
     * 三列位置沿用原 BTN1、BTN2、BTN3 的横向位置。
     */
    --popup1-grid-col1-left: 7%;
    --popup1-grid-col2-left: 39.78%;
    --popup1-grid-col3-left: 72.55%;

    /*
     * 第三排只有 BTN7、BTN8，自动居中排列。
     *
     * 上边距、排间距、下边距都按照按钮直径计算，
     * 所以无论窗口怎样缩放，弹框和圆形按钮都会同步自适应。
     */
    --popup1-grid-top-padding: 90%;
    --popup1-grid-row-gap:    25%;
    --popup1-grid-bottom-padding: 30%;


    /*
     * 界面中间左侧 FIRE 按钮
     * 可独立调整位置与大小
     */
    --mode-fire-left: 13%;
    --mode-fire-top:  51%;
    --mode-fire-w:    6%;
    --mode-fire-h:    13%;

    --bg:#000; --fg:#fff;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg); }
  body{ display:flex; justify-content:center; }
  .wrap{ width:min(94vw, 520px); margin:12px auto 48px; }

  .phone{ position:relative; width:100%; }
  .phone img{ width:100%; height:auto; display:block; user-select:none; pointer-events:none; }

  .hit{
    position:absolute; border:none; outline:none; background:transparent;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
    transform-origin:center;
  }
  .hit:active{ transform:scale(.98); }


  .hit.circle{
    border-radius:999px;
  }

  .popup{
    position:absolute;
    z-index:50;
    display:none;
    background:rgba(0,0,0,.6);
    border:1.5px dashed #00ffff;
    border-radius:12px;
  }

  .popup.show{
    display:block;
  }


  .popup-inner-circle{
    position:absolute;
    z-index:60;
    border-radius:999px !important;
  }

  /*
   * BTN4 / BTN7 右下角同步次数。
   * 使用独立元素，避免与调试用 aria-label 文字互相覆盖。
   */
  .popup-count-badge{
    position:absolute;
    right:4px;
    bottom:3px;
    z-index:80;
    min-width:17px;
    height:17px;
    padding:0 4px;
    box-sizing:border-box;
    border-radius:999px;
    background:rgba(0,0,0,.82);
    border:1px solid #00ffff;
    color:#ffffff;
    font:700 11px/15px system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    text-align:center;
    pointer-events:none;
    text-shadow:0 0 3px #000;
  }

  .popup-count-badge[hidden]{
    display:none;
  }

  .popup::after{
    content:attr(data-label);
    position:absolute;
    left:8px;
    top:6px;
    font:600 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    color:#00ffff;
    text-shadow:0 0 3px #000;
    pointer-events:none;
  }

  /* ===== 调试描边：对齐OK后，把这两段注释掉即可 ===== */
  .hit{ background:rgba(255,0,0,.22); border:1.5px dashed #00ffff; border-radius:8px; }

  /*
   * MODE FIRE 按钮固定为方形/矩形。
   * 宽高仍由 --mode-fire-w / --mode-fire-h 独立控制。
   */
  .hit.mode-fire-square{
    border-radius:0 !important;
  }
  .hit::after{
    content: attr(aria-label);
    position:absolute; left:4px; top:2px; font: 600 10px/1 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color:#00ffff; text-shadow:0 0 3px #000; pointer-events:none;
  }
  /* =============================================== */

  /* 左下角开机音按钮 */
  .open-phone-btn{
    position:fixed;
    left:calc(14px + env(safe-area-inset-left));
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:9999;
    min-width:92px;
    height:44px;
    padding:0 14px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:12px;
    background:rgba(0,0,0,.78);
    color:#fff;
    font:700 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    letter-spacing:.5px;
    box-shadow:0 4px 16px rgba(0,0,0,.38);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .open-phone-btn:active{
    transform:scale(.96);
  }

</style>
</head>
<body>
  <button class="open-phone-btn" id="btnOpenPhone" type="button" aria-label="播放开机音">OPEN PHONE</button>
  <div class="wrap">
    <div class="phone" id="phone">
      <img src="assets/ui.jpg" alt="FAIZ UI" id="ui"/>


      <!-- 顶部第一个圆形按钮：打开第一层弹框 -->
      <button class="hit circle" id="btnTop1" aria-label="TOP1"></button>


      <!-- TOP1B：变身后播放 s-ready，并进入 ENTER 待触发状态 -->
      <button class="hit circle" id="btnTop1B" aria-label="TOP1-B"></button>

      <!-- TOP2：短按 ready；长按 1 秒 ready-metal -->
      <button class="hit circle" id="btnTop2" aria-label="TOP2"></button>


      <!-- 顶部第三个圆形按钮：交互与第二个按钮完全相同 -->
      <button class="hit circle" id="btnTop3" aria-label="TOP3"></button>


      <!-- 顶部第四个圆形按钮：打开第二个弹框 -->
      <button class="hit circle" id="btnTop4" aria-label="TOP4"></button>

      <!-- 第四个圆形按钮对应弹框 -->
      <div class="popup" id="popup4" data-label="POPUP4"></div>

      <!-- 第一层弹框：加入三个独立圆形按钮 -->
      <div class="popup" id="popup1" data-label="POPUP1">
        <button class="hit circle popup-inner-circle"
                id="popup1Btn1"
                type="button"
                aria-label="POPUP1-BTN1"></button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn2"
                type="button"
                aria-label="POPUP1-BTN2"></button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn3"
                type="button"
                aria-label="POPUP1-BTN3"></button>

        <!-- TOP1 弹框 POPUP1-BTN1～POPUP1-BTN9：总共 9 个 -->
        <button class="hit circle popup-inner-circle"
                id="popup1Btn4"
                type="button"
                aria-label="POPUP1-BTN4">
          <span class="popup-count-badge"
                id="popup1Btn4Count"
                aria-hidden="true"
                hidden>0</span>
        </button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn5"
                type="button"
                aria-label="POPUP1-BTN5"></button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn6"
                type="button"
                aria-label="POPUP1-BTN6"></button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn7"
                type="button"
                aria-label="POPUP1-BTN7">
          <span class="popup-count-badge"
                id="popup1Btn7Count"
                aria-hidden="true"
                hidden>0</span>
        </button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn8"
                type="button"
                aria-label="POPUP1-BTN8"></button>

        <button class="hit circle popup-inner-circle"
                id="popup1Btn9"
                type="button"
                aria-label="POPUP1-BTN9"></button>


      </div>

      <!-- 中间左侧：106/103 模式共用 FIRE 按钮 -->
      <button class="hit mode-fire-square"
              id="btnModeFire"
              type="button"
              aria-label="MODE-FIRE"></button>

      <!-- ENTER -->
      <button class="hit" id="btnEnter" aria-label="ENTER"></button>

      <!-- 第二行：铃声 / クリア / 停止 -->
      <button class="hit" id="btnRing"  aria-label="铃声"></button>
      <button class="hit" id="btnClear" aria-label="クリア"></button>
      <button class="hit" id="btnStop"  aria-label="停止"></button>

      <!-- 数字键 1~9、*0# -->
      <button class="hit" id="btnKey1" data-k="1" aria-label="1"></button>
      <button class="hit" id="btnKey2" data-k="2" aria-label="2"></button>
      <button class="hit" id="btnKey3" data-k="3" aria-label="3"></button>

      <button class="hit" id="btnKey4" data-k="4" aria-label="4"></button>
      <button class="hit" id="btnKey5" data-k="5" aria-label="5"></button>
      <button class="hit" id="btnKey6" data-k="6" aria-label="6"></button>

      <button class="hit" id="btnKey7" data-k="7" aria-label="7"></button>
      <button class="hit" id="btnKey8" data-k="8" aria-label="8"></button>
      <button class="hit" id="btnKey9" data-k="9" aria-label="9"></button>

      <button class="hit" id="btnStar" data-k="*" aria-label="*"></button>
      <button class="hit" id="btnKey0" data-k="0" aria-label="0"></button>
      <button class="hit" id="btnHash" data-k="#" aria-label="#"></button>
    </div>
  </div>

<script>
(() => {
  /* ------------ 资源（自动匹配 .m4a/.mp3/.wav/.mp4） ------------ */
  const BASE = {
    openPhone: 'assets/open phone',
    ring:      'assets/ring',
    enter:     'assets/enter',
    key1:      'assets/key1',
    key5_2:    'assets/key5_2',
    key5_3:    'assets/key5_3',
    standBy:   'assets/stand by',
    complete:  'assets/complete',
    error:     'assets/error',
    ready:      'assets/ready',
    readyMetal: 'assets/ready-metal',
    sReady:     'assets/s-ready',
    exceed:     'assets/exceed charge',
    exceed2:   'assets/exceed charge2',
    release:   'assets/release',
    combo3821: 'assets/3821',
    weaponHit: 'assets/weaponHit',
    weaponHit2:'assets/weaponhit2',
    qj:        'assets/qj',
    faizSeed:  'assets/faiz-seed',
    seedEnd:   'assets/seed-end',
    startup:        'assets/startup',
    seeding:        'assets/seeding',
    seeding2:       'assets/seeding2',
    seeding3:       'assets/seeding3',
    seeding4:       'assets/seeding4',
    seedHit:        'assets/seed hit',
    kickLine:       'assets/kick-line',
    seedRun:        'assets/seed run',
    seedHit2:       'assets/seed hit2',
    seedBox:        'assets/seed box',
    kick:           'assets/kick',
    kickEnd:        'assets/kick-end',
    burstMode:      'assets/burst_mode',
    sigleMode:      'assets/sigle_mode',
    burstModeFire:  'assets/burst_mode-fire',
    sigleModeFire:  'assets/sigle_mode_fire'
  };
  const EXT = ['.m4a','.mp3','.wav','.mp4'];
  const urlMap = {};

  let ac=null, master=null;
  const buffers=new Map();
  function ctx(){ if(ac) return ac; const C=window.AudioContext||window.webkitAudioContext; ac=new C({latencyHint:'interactive'}); master=ac.createGain(); master.gain.value=1; master.connect(ac.destination); return ac; }
  /*
   * 音效加载器：
   * 不再使用 HEAD 探测文件，因为 GitHub Pages / PWA 缓存环境
   * 可能对 HEAD 返回异常，导致文件实际存在却被误判为不存在。
   *
   * 现在会直接逐个尝试 GET：
   * .m4a → .mp3 → .wav → .mp4
   */
  async function load(key){
    if(buffers.has(key)) return buffers.get(key);

    const base=BASE[key];
    if(!base) return null;

    /*
     * 已经解析过真实地址时优先直接读取。
     */
    const knownUrl=urlMap[base];

    if(knownUrl){
      try{
        const res=await fetch(knownUrl);

        if(res.ok){
          const arr=await res.arrayBuffer();
          const b=await ctx().decodeAudioData(arr.slice(0));
          buffers.set(key,b);
          return b;
        }
      }catch(error){
        console.warn(`${key} 已记录地址读取失败，重新探测：`,error);
      }

      delete urlMap[base];
    }

    /*
     * 直接 GET 每一种扩展名。
     * 只有真实取得并成功解码的文件才算加载成功。
     */
    for(const ext of EXT){
      const url=`${base}${ext}`;

      try{
        const res=await fetch(url);

        if(!res.ok) continue;

        const arr=await res.arrayBuffer();

        if(!arr || arr.byteLength===0) continue;

        const b=await ctx().decodeAudioData(arr.slice(0));

        urlMap[base]=url;
        buffers.set(key,b);

        return b;
      }catch(error){
        /*
         * 当前扩展名失败时继续尝试下一种，
         * 不让一个 404 或解码失败终止整个加载过程。
         */
      }
    }

    return null;
  }
  function play(
    key,
    {
      loop=false,
      loopStart=null,
      loopEnd=null
    }={}
  ){
    const b=buffers.get(key);
    if(!b) return null;

    const s=ctx().createBufferSource();
    s.buffer=b;
    s.loop=!!loop;

    if(Number.isFinite(loopStart)){
      s.loopStart=Math.max(0,loopStart);
    }

    if(Number.isFinite(loopEnd) && loopEnd>0){
      s.loopEnd=Math.min(loopEnd,b.duration);
    }

    s.connect(master);
    s.start();
    return s;
  }
  function stop(n){ if(n&&n.stop){ try{n.stop();}catch{} } }



  /* ------------ 规则/状态 ------------ */
  const COMBOS=['555','106','103'];

  let buf='';
  let transformed=false;
  let armed=false;
  let standByPlaying=false;
  let standByEndAt=0;
  let standByTimer=null;
  let readyArmed=false;

  /*
   * ENTER 长按分支：
   * TOP2 / TOP3 已播放 ready 后，按住 ENTER 达到 0.5 秒，
   * 播放 enter → exceed charge2，并阻止普通 exceed charge。
   *
   * 修改此数值即可调整长按时间。
   */
  const ENTER_LONG_PRESS_MS=500;
  let enterPressTimer=null;
  let enterPressPointerId=null;
  let enterLongPressTriggered=false;

  /*
   * TOP2 长按分支：
   * 短按播放 ready；
   * 长按满 0.5 秒只播放 ready-metal，不播放 ready。
   */
  const TOP2_LONG_PRESS_MS=500;
  let top2PressTimer=null;
  let top2PressPointerId=null;
  let top2LongPressTriggered=false;

  /*
   * 106 / 103 模式共用 FIRE 按钮状态。
   * modeFireType:
   * - null：未解锁
   * - burst：106 模式
   * - sigle：103 模式
   */
  let modeFireType=null;
  let modeFireShots=0;
  let modeSequenceToken=0;
  const MODE_FIRE_MAX_SHOTS=3;

  /*
   * # 长按分支：
   * 仅变身后有效。
   * 短按播放 weaponHit；
   * 长按满 0.5 秒只播放 weaponhit2。
   */
  const HASH_LONG_PRESS_MS=500;
  let hashPressTimer=null;
  let hashPressPointerId=null;
  let hashLongPressTriggered=false;

  const MUSIC_LONG_PRESS_MS=500;
  const MUSIC_FADE_OUT_MS=2000;

  /*
   * 现有 POPUP1-BTN2：
   * 短按：seeding → seeding2 持续循环；
   * 长按 0.5 秒：seeding3 → seeding4 持续循环。
   */
  const POPUP1_BTN2_LONG_PRESS_MS=500;
  let popup1Btn2PressTimer=null;
  let popup1Btn2PressPointerId=null;
  let popup1Btn2LongPressTriggered=false;

  /*
   * 两首完整音乐使用 HTMLAudioElement 流式播放。
   * 不再在 OPEN PHONE 阶段下载并解码成 AudioBuffer。
   */
  const musicButtons={
    '0':{
      url:'assets/The people with no name.m4a',
      label:'The people with no name',
      timer:null,
      pointerId:null,
      longTriggered:false,
      stopTriggered:false,
      audio:null,
      preloadAudio:null,
      fadeFrame:null,
      fading:false
    },
    '7':{
      url:'assets/EGO~eyes glazing over.m4a',
      label:'EGO~eyes glazing over',
      timer:null,
      pointerId:null,
      longTriggered:false,
      stopTriggered:false,
      audio:null,
      preloadAudio:null,
      fadeFrame:null,
      fading:false
    }
  };


  /*
   * TOP1 的 FAIZ Seed 状态：
   * complete 播放结束后解锁。
   * 第一次点击播放 faiz-seed。
   * 第二次点击进入预留的结束音效分支。
   */
  let faizSeedUnlocked=false;
  let faizSeedActive=false;
  let faizSeedLoading=false;

  /*
   * POPUP1-BTN2 音效序列状态：
   *
   * 短按：seeding → seeding2 持续循环。
   * 长按：seeding3 → seeding4 持续循环。
   *
   * 两种序列都共用同一播放节点和循环开关，
   * 只有再次按 TOP1 才会调用 stopSeeding() 终止。
   */
  let seedingNode=null;
  let seedingLoopActive=false;

  /*
   * POPUP1 按钮音效锁定规则。
   *
   * BTN3：锁定 BTN4、BTN5、BTN7。
   * BTN4：锁定 BTN3，但 BTN4 自身保持可点击以累计次数。
   * BTN5：锁定 BTN3、BTN4、BTN7。
   *
   * BTN3、BTN4 只有普通点击，没有长按分支。
   * BTN5 暂时保留短按和长按共用规则。
   * 锁定只有在 TOP1 再次按下并且 seed-end 播放完成后解除。
   */
  const POPUP1_BRANCH_LONG_PRESS_MS=500;
  const POPUP1_SOUND_LOCK_RULES={
    3:[4,5,7],
    4:[3],
    5:[3,4,7]
  };

  const popup1LockedSoundButtons=new Set();

  const popup1BranchPressStates={
    5:{timer:null,pointerId:null,longTriggered:false}
  };

  let seedEndNode=null;
  let seedEndTimer=null;
  let seedEndPlaying=false;

  /*
   * BTN4 / BTN7 连携状态。
   *
   * BTN4 每次有效触发：
   * - 播放 kick-line
   * - 次数 +1
   * - BTN4 与 BTN7 同步显示次数
   *
   * BTN7：
   * - 次数为 0 时无效
   * - kick 按次数顺序播放
   * - 最后播放一次 kick-end
   * - kick-end 结束后次数归零
   */
  let kickLineCount=0;
  let kickSequencePlaying=false;
  let kickSequenceNode=null;
  let kickSequenceToken=0;
  let popup1SoundSessionToken=0;

  /*
   * complete 的结束状态采用 onended + 音频时长定时器双保险。
   * 避免声音听起来结束了，但浏览器回调仍未执行。
   */
  let completeNode=null;
  let completeTimer=null;
  let completeDone=false;

  let ringNode=null;
  let standNode=null;

  /*
   * v35 分阶段加载：
   *
   * 1. OPEN PHONE 只等待 openPhone，加载完成后立即播放。
   * 2. 随后分批准备会被同步调用的常用短音效。
   * 3. 页面可操作后，再利用空闲时间加载低频短音效。
   * 4. 两首完整音乐不进入 AudioBuffer，长按时才流式播放。
   */
  let audioReady=false;
  let audioLoading=false;

  let auxiliaryPreloadStarted=false;
  let top1RoutePreloadStarted=false;
  let popup1PreloadStarted=false;

  /*
   * OPEN PHONE 后立即解码。
   * 这些是主界面最常用且需要同步响应的短音效。
   */
  const ESSENTIAL_AUDIO_KEYS=[
    'ring',
    'enter',
    'key1',
    'key5_2',
    'key5_3',
    'standBy',
    'complete',
    'error',
    'ready',
    'sReady',
    'exceed',
    'release',
    'combo3821',
    'weaponHit',
    'qj',
    'seedEnd'
  ];

  /*
   * OPEN PHONE 完成后利用空闲时间准备。
   * 与 TOP1 弹框无关，避免它们阻塞基础操作。
   */
  const AUXILIARY_AUDIO_KEYS=[
    'readyMetal',
    'exceed2',
    'weaponHit2',
    'burstMode',
    'sigleMode',
    'burstModeFire',
    'sigleModeFire'
  ];

  /*
   * complete 完成后再准备 TOP1 主路线。
   */
  const TOP1_ROUTE_AUDIO_KEYS=[
    'faizSeed',
    'seedEnd',
    'startup',
    'seeding',
    'seeding2',
    'seeding3',
    'seeding4'
  ];

  /*
   * POPUP1 打开后才准备 BTN3～BTN8 专用音效；BTN9 使用 TOP1 路线中的 seed-end。
   */
  const POPUP1_AUDIO_KEYS=[
    'seedHit',
    'kickLine',
    'seedRun',
    'seedHit2',
    'seedBox',
    'kick',
    'kickEnd'
  ];

  /*
   * 退出 Seed 模式后释放这些低频 AudioBuffer。
   * 文件仍保留在 Service Worker 音频缓存中，
   * 下次只需本地重新解码，不会重新联网下载。
   */
  const RELEASABLE_POPUP1_AUDIO_KEYS=[
    ...POPUP1_AUDIO_KEYS
  ];

  function stageOf(s){
    for(const c of COMBOS){
      if(c.startsWith(s)) return s.length;
    }
    return 0;
  }

  function interruptRing(){
    if(ringNode){
      stop(ringNode);
      ringNode=null;
    }
  }


  function finishStandBy(){
    if(standByTimer){
      clearTimeout(standByTimer);
      standByTimer=null;
    }

    standNode=null;
    standByEndAt=0;
    standByPlaying=false;
    armed=true;
  }

  function resetStandBy(){
    if(standByTimer){
      clearTimeout(standByTimer);
      standByTimer=null;
    }

    if(standNode){
      standNode.onended=null;
      stop(standNode);
      standNode=null;
    }

    standByEndAt=0;
    standByPlaying=false;
    armed=false;
  }


  function clearCompleteTimer(){
    if(completeTimer){
      clearTimeout(completeTimer);
      completeTimer=null;
    }
  }

  function finishComplete(){
    if(completeDone) return;
    completeDone=true;

    clearCompleteTimer();
    completeNode=null;

    transformed=true;
    readyArmed=false;

    /*
     * complete 确认播放结束后，才解锁 TOP1。
     */
    faizSeedUnlocked=true;
    faizSeedActive=false;
    faizSeedLoading=false;

    stopSeeding();
    stopSeedEndPlayback();
    stopKickSequence({resetCount:true});
    popup1SoundSessionToken+=1;
    resetPopup1SoundButtonLocks();
    closeSeedPopup();

    resetStandBy();
    buf='';

    /*
     * 变身完成后再准备 TOP1 路线，
     * 不让 TOP1 专用音效拖慢 OPEN PHONE。
     */
    startTop1RouteAudioPreload();
  }

  function resetCompleteState(){
    clearCompleteTimer();

    if(completeNode){
      completeNode.onended=null;
      stop(completeNode);
      completeNode=null;
    }

    completeDone=false;
  }


  async function ensureSoundLoaded(key){
    if(buffers.has(key)) return true;

    try{
      const loaded=await load(key);
      return !!loaded;
    }catch(error){
      console.error(`${key} 音效加载失败：`,error);
      return false;
    }
  }

  function stopSeeding(){
    /*
     * 先关闭循环开关，再停止当前音频。
     * 这样 onended 即使稍后触发，也不会重新播放。
     */
    seedingLoopActive=false;

    if(!seedingNode) return;

    seedingNode.onended=null;
    stop(seedingNode);
    seedingNode=null;
  }

  function syncPopup1SoundButtonLocks(){
    for(let buttonNumber=3;buttonNumber<=9;buttonNumber+=1){
      const button=document.getElementById(`popup1Btn${buttonNumber}`);

      if(!button) continue;

      const branchLocked=
        popup1LockedSoundButtons.has(buttonNumber);

      const kickBusyLocked=
        kickSequencePlaying
        && (buttonNumber===4 || buttonNumber===7);

      const locked=branchLocked || kickBusyLocked;

      button.disabled=locked;
      button.dataset.soundLocked=locked ? 'true' : 'false';
      button.setAttribute('aria-disabled',locked ? 'true' : 'false');
    }
  }

  function resetPopup1SoundButtonLocks(){
    popup1LockedSoundButtons.clear();
    syncPopup1SoundButtonLocks();
  }

  function canTriggerPopup1ButtonSound(buttonNumber){
    const popup1=document.getElementById('popup1');

    if(!audioReady) return false;
    if(!faizSeedUnlocked) return false;
    if(!popup1.classList.contains('show')) return false;

    /*
     * BTN3 / BTN4 / BTN6 / BTN7：
     *
     * 即使 BTN9 已经结束 Seed 流程，
     * 或 seed-end 仍在播放，
     * 只要 POPUP1 还打开，就继续允许触发。
     */
    const allowedAfterSeedEnd=
      buttonNumber===3
      || buttonNumber===4
      || buttonNumber===6
      || buttonNumber===7;

    if(!allowedAfterSeedEnd){
      if(!faizSeedActive) return false;
      if(seedEndPlaying) return false;
    }

    /*
     * BTN4 / BTN7 自身的连携防重复规则保留：
     * 已有 kick 连携播放时，不允许再次启动另一套，
     * 也不允许 BTN4 继续累计新的次数。
     */
    if(
      kickSequencePlaying
      && (
        buttonNumber===4
        || buttonNumber===7
      )
    ){
      return false;
    }

    return !isPopup1SoundButtonLocked(buttonNumber);
  }

  async function triggerPopup1SimpleSound(key,fileLabel){
    const sessionToken=popup1SoundSessionToken;
    const loaded=await ensureSoundLoaded(key);

    if(!loaded){
      console.warn(`未找到 assets/${fileLabel}.m4a`);
      return false;
    }

    /*
     * 音效加载期间若已经按 TOP1 结束本轮 Seed 模式，
     * 不允许旧点击在新状态里补播。
     */
    if(sessionToken!==popup1SoundSessionToken) return false;
    if(!faizSeedUnlocked || !faizSeedActive) return false;
    if(seedEndPlaying) return false;

    interruptRing();

    const node=play(key);

    if(!node){
      console.warn(`${fileLabel} 无法播放`);
      return false;
    }

    return true;
  }

  function stopKickSequence({resetCount=false}={}){
    kickSequenceToken+=1;

    if(kickSequenceNode){
      kickSequenceNode.onended=null;
      stop(kickSequenceNode);
      kickSequenceNode=null;
    }

    kickSequencePlaying=false;

    if(resetCount){
      resetKickLineCount();
    }

    syncPopup1SoundButtonLocks();
  }

  function finishKickSequence(token){
    if(token!==kickSequenceToken) return;

    kickSequenceNode=null;
    kickSequencePlaying=false;
    resetKickLineCount();
    syncPopup1SoundButtonLocks();
  }

  function playKickEndAfterSeries(token,sessionToken){
    if(token!==kickSequenceToken) return;
    if(sessionToken!==popup1SoundSessionToken) return;

    const node=play('kickEnd');

    if(!node){
      console.warn('kick-end 无法播放');
      finishKickSequence(token);
      return;
    }

    kickSequenceNode=node;

    node.onended=()=>{
      if(token!==kickSequenceToken) return;

      kickSequenceNode=null;
      finishKickSequence(token);
    };
  }

  function playNextKickInSeries(
    remaining,
    token,
    sessionToken
  ){
    if(token!==kickSequenceToken) return;
    if(sessionToken!==popup1SoundSessionToken) return;

    if(remaining<=0){
      playKickEndAfterSeries(token,sessionToken);
      return;
    }

    const node=play('kick');

    if(!node){
      console.warn('kick 无法播放');
      finishKickSequence(token);
      return;
    }

    kickSequenceNode=node;

    node.onended=()=>{
      if(token!==kickSequenceToken) return;

      kickSequenceNode=null;

      playNextKickInSeries(
        remaining-1,
        token,
        sessionToken
      );
    };
  }

  async function triggerPopup1Btn7KickSeries(event){
    if(event){
      event.preventDefault();
      event.stopPropagation();
    }

    if(!canTriggerPopup1ButtonSound(7)) return;
    if(kickLineCount<=0) return;
    if(kickSequencePlaying) return;

    const requestedKickCount=kickLineCount;
    const sessionToken=popup1SoundSessionToken;
    const token=kickSequenceToken+1;

    kickSequenceToken=token;
    kickSequencePlaying=true;
    syncPopup1SoundButtonLocks();

    const [kickLoaded,kickEndLoaded]=await Promise.all([
      ensureSoundLoaded('kick'),
      ensureSoundLoaded('kickEnd')
    ]);

    if(token!==kickSequenceToken) return;
    if(sessionToken!==popup1SoundSessionToken) return;

    if(!kickLoaded){
      console.warn('未找到 assets/kick.m4a');
      finishKickSequence(token);
      return;
    }

    if(!kickEndLoaded){
      console.warn('未找到 assets/kick-end.m4a');
      finishKickSequence(token);
      return;
    }

    if(!faizSeedUnlocked || !faizSeedActive || seedEndPlaying){
      finishKickSequence(token);
      return;
    }

    interruptRing();

    playNextKickInSeries(
      requestedKickCount,
      token,
      sessionToken
    );
  }

  async function triggerPopup1Btn4KickLine(){
    /*
     * 次数代表有效按下次数，因此点击被接受后立即 +1。
     * 首次加载音频稍慢时，界面计数仍然即时响应。
     */
    incrementKickLineCount();

    await triggerPopup1SimpleSound(
      'kickLine',
      'kick-line'
    );
  }

  async function triggerPopup1DirectSound(
    buttonNumber,
    key,
    fileLabel,
    event
  ){
    if(event){
      event.preventDefault();
      event.stopPropagation();
    }

    if(!canTriggerPopup1ButtonSound(buttonNumber)) return;

    await triggerPopup1SimpleSound(key,fileLabel);
  }

  /*
   * BTN9：结束当前 Seed 模式。
   *
   * 执行顺序：
   * 1. 停止 seeding / seeding2 / seeding3 / seeding4
   * 2. 保留已经启动的 BTN7 kick 连携
   * 3. 播放 seed-end
   * 4. 立即结束 Seed 模式并关闭 POPUP1
   * 5. 立即重置 BTN4 / BTN7 次数与分支锁定
   * 6. seed-end 播放期间，BTN3 / BTN4 / BTN6 / BTN7 仍可触发
   *
   * 注意：
   * - 不增加 popup1SoundSessionToken，否则 BTN7 连携会被中断。
   * - 不调用 stopKickSequence()。
   */
  async function triggerPopup1Btn9SeedEnd(event){
    if(event){
      event.preventDefault();
      event.stopPropagation();
    }

    if(!canTriggerPopup1ButtonSound(9)) return;

    const sessionToken=popup1SoundSessionToken;
    const loaded=await ensureSoundLoaded('seedEnd');

    if(!loaded){
      console.warn('未找到 assets/seed-end.m4a');
      return;
    }

    /*
     * 加载期间若已经切换到其他 Seed 会话，
     * 本次旧点击不得补播。
     */
    if(sessionToken!==popup1SoundSessionToken) return;
    if(!faizSeedUnlocked || !faizSeedActive) return;
    if(seedEndPlaying) return;

    stopSeeding();
    interruptRing();
    stopSeedEndPlayback();

    const seedEndBuffer=buffers.get('seedEnd');
    const node=play('seedEnd');

    if(!node){
      console.warn('seed-end 无法播放');
      return;
    }

    seedEndPlaying=true;
    seedEndNode=node;

    node.onended=finishSeedEnd;

    if(seedEndBuffer){
      seedEndTimer=setTimeout(
        finishSeedEnd,
        Math.ceil(
          (seedEndBuffer.duration+0.08)*1000
        )
      );
    }

    /*
     * 立即结束 Seed 模式，但保持 POPUP1 打开。
     *
     * 不改变 popup1SoundSessionToken，
     * 让已启动的 BTN7 连携继续使用原会话播放完。
     *
     * POPUP1 随后只由 TOP1 关闭。
     */
    faizSeedActive=false;
    faizSeedLoading=false;

    /*
     * 立即归零显示次数并清除 BTN3 / BTN4 / BTN5 的分支锁定。
     *
     * kickSequencePlaying 若仍为 true，
     * BTN4 / BTN7 的忙碌锁会自然保留到连携播放完成，
     * 但不会停止连携。
     */
    resetKickLineCount();
    resetPopup1SoundButtonLocks();

    /*
     * 不释放 kick / kick-end AudioBuffer。
     * 否则正在继续的 BTN7 连携可能在下一段播放时找不到音频。
     */
  }

  function activatePopup1ButtonSoundLine(buttonNumber,pressType){
    if(!canTriggerPopup1ButtonSound(buttonNumber)) return false;

    const buttonsToLock=POPUP1_SOUND_LOCK_RULES[buttonNumber] || [];

    buttonsToLock.forEach((number)=>{
      popup1LockedSoundButtons.add(number);
    });

    syncPopup1SoundButtonLocks();

    const button=document.getElementById(`popup1Btn${buttonNumber}`);

    if(button){
      button.dataset.lastPressType=pressType;
    }

    /*
     * BTN3、BTN4 由普通点击进入。
     * BTN5 才保留短按 / 长按共用锁定框架。
     */
    if(buttonNumber===3){
      void triggerPopup1SimpleSound(
        'seedHit',
        'seed hit'
      );
    }else if(buttonNumber===4){
      void triggerPopup1Btn4KickLine();
    }

    /*
     * BTN5 当前只负责建立锁定逻辑，尚未配置音效。
     */
    return true;
  }

  function clearPopup1BranchPressTimer(buttonNumber){
    const state=popup1BranchPressStates[buttonNumber];

    if(!state || !state.timer) return;

    clearTimeout(state.timer);
    state.timer=null;
  }

  function onPopup1BranchPointerDown(buttonNumber,event){
    event.stopPropagation();

    const state=popup1BranchPressStates[buttonNumber];

    if(!state) return;
    if(event.pointerType==='mouse' && event.button!==0) return;
    if(state.pointerId!==null) return;
    if(!canTriggerPopup1ButtonSound(buttonNumber)) return;

    state.pointerId=event.pointerId;
    state.longTriggered=false;

    try{
      event.currentTarget.setPointerCapture(event.pointerId);
    }catch{}

    clearPopup1BranchPressTimer(buttonNumber);

    state.timer=setTimeout(()=>{
      state.timer=null;

      if(state.pointerId!==event.pointerId) return;
      if(!canTriggerPopup1ButtonSound(buttonNumber)) return;

      state.longTriggered=true;
      activatePopup1ButtonSoundLine(buttonNumber,'long');
    },POPUP1_BRANCH_LONG_PRESS_MS);
  }

  function finishPopup1BranchPointer(
    buttonNumber,
    event,
    {cancelled=false}={}
  ){
    event.stopPropagation();

    const state=popup1BranchPressStates[buttonNumber];

    if(!state || state.pointerId!==event.pointerId) return;

    clearPopup1BranchPressTimer(buttonNumber);

    const wasLongPress=state.longTriggered;

    state.pointerId=null;
    state.longTriggered=false;

    try{
      event.currentTarget.releasePointerCapture(event.pointerId);
    }catch{}

    if(!cancelled && !wasLongPress){
      activatePopup1ButtonSoundLine(buttonNumber,'short');
    }
  }

  function bindPopup1SoundLineButton(buttonNumber){
    const button=document.getElementById(`popup1Btn${buttonNumber}`);
    const state=popup1BranchPressStates[buttonNumber];

    if(!button || !state) return;

    button.addEventListener('pointerdown',(event)=>{
      onPopup1BranchPointerDown(buttonNumber,event);
    });

    button.addEventListener('pointerup',(event)=>{
      event.preventDefault();
      finishPopup1BranchPointer(buttonNumber,event);
    });

    button.addEventListener('pointercancel',(event)=>{
      finishPopup1BranchPointer(
        buttonNumber,
        event,
        {cancelled:true}
      );
    });

    button.addEventListener('lostpointercapture',()=>{
      clearPopup1BranchPressTimer(buttonNumber);
      state.pointerId=null;
      state.longTriggered=false;
    });

    button.addEventListener('contextmenu',(event)=>{
      event.preventDefault();
      event.stopPropagation();
    });

    button.addEventListener('click',(event)=>{
      if(event.detail===0){
        activatePopup1ButtonSoundLine(buttonNumber,'short');
      }else{
        event.preventDefault();
        event.stopPropagation();
      }
    });
  }

  function clearSeedEndTimer(){
    if(seedEndTimer){
      clearTimeout(seedEndTimer);
      seedEndTimer=null;
    }
  }

  function stopSeedEndPlayback(){
    clearSeedEndTimer();

    if(seedEndNode){
      seedEndNode.onended=null;
      stop(seedEndNode);
      seedEndNode=null;
    }

    seedEndPlaying=false;
  }

  function finishSeedEnd(){
    if(!seedEndPlaying) return;

    clearSeedEndTimer();
    seedEndNode=null;
    seedEndPlaying=false;

    /*
     * BTN9 在 seed-end 开始播放时已经立即结束 Seed 模式、
     * 重置次数并清除分支锁定。
     *
     * 这里仅收尾 seed-end 自身，绝不停止正在播放的
     * BTN7 kick → kick-end 连携。
     */
  }


  /*
   * seeding2 循环：每次结束后立即播放下一遍，
   * 直到 TOP1 调用 stopSeeding()。
   */
  function playNextSeeding2Loop(){
    if(!seedingLoopActive) return;

    const node=play('seeding2');

    if(!node){
      console.warn('seeding2 无法播放');
      seedingLoopActive=false;
      seedingNode=null;
      return;
    }

    seedingNode=node;

    node.onended=()=>{
      if(seedingNode===node){
        seedingNode=null;
      }

      if(seedingLoopActive){
        playNextSeeding2Loop();
      }
    };
  }

  /*
   * 先播放一次 seeding，
   * seeding 结束后立即进入 seeding2 无限循环。
   */
  function playSeedingThenLoopSeeding2(){
    if(!seedingLoopActive) return;

    const node=play('seeding');

    if(!node){
      console.warn('seeding 无法播放');
      seedingLoopActive=false;
      seedingNode=null;
      return;
    }

    seedingNode=node;

    node.onended=()=>{
      if(seedingNode===node){
        seedingNode=null;
      }

      if(seedingLoopActive){
        playNextSeeding2Loop();
      }
    };
  }

  /*
   * seeding4 循环：
   * 每次播放结束后立即播放下一遍。
   * POPUP1-BTN3～BTN8 不会影响它；
   * BTN9 会调用 stopSeeding() 并结束 Seed 模式。
   */
  function playNextSeeding4Loop(){
    if(!seedingLoopActive) return;

    const buffer=buffers.get('seeding4');

    /*
     * 只创建一次 AudioBufferSourceNode，
     * 由 Web Audio 音频线程在同一个 AudioBuffer 内原生循环。
     *
     * 不再使用：
     * onended → JavaScript 回调 → 新建节点 → 下一遍
     */
    const node=play(
      'seeding4',
      {
        loop:true,
        loopStart:0,
        loopEnd:buffer?.duration
      }
    );

    if(!node){
      console.warn('seeding4 无法播放');
      seedingLoopActive=false;
      seedingNode=null;
      return;
    }

    seedingNode=node;

    node.onended=()=>{
      /*
       * 原生循环不会自然结束。
       * 这里只处理 stopSeeding() 主动停止后的节点清理。
       */
      if(seedingNode===node){
        seedingNode=null;
      }
    };
  }

   * 长按 POPUP1-BTN2：
   * 先播放一次 seeding3，
   * seeding3 结束后进入 seeding4 无限循环。

  function playSeeding3ThenLoopSeeding4(){
    if(!seedingLoopActive) return;

    const node=play('seeding3');

    if(!node){
      console.warn('seeding3 无法播放');
      seedingLoopActive=false;
      seedingNode=null;
      return;
    }

    seedingNode=node;

    node.onended=()=>{
      if(seedingNode===node){
        seedingNode=null;
      }

      if(seedingLoopActive){
        playNextSeeding4Loop();
      }
    };
  }

  function waitForIdle(){
    return new Promise((resolve)=>{
      if('requestIdleCallback' in window){

          ()=>resolve(),
          {timeout:350}
        );

        setTimeout(resolve,60);

  /*
   * v41 加载方式：
   * 每一项直接进入 load()，完成 GET、读取和解码。
   * 不再区分“预下载”和“稍后解码”。
   */
  async function preloadAudioKeys(
    keys,
    {batchSize=3,useIdle=false}={}
  ){
    for(let i=0;i<keys.length;i+=batchSize){
      const batch=keys.slice(i,i+batchSize);

      await Promise.all(
        batch.map((key)=>load(key).catch((error)=>{
          console.warn(`${key} 后台加载失败：`,error);
          return null;
        }))
      );

      if(useIdle && i+batchSize<keys.length){
        await waitForIdle();
      }
    }
  }

  function playSequence(keys,onDone=null){
    const queue=[...keys];

    const finish=()=>{
      if(typeof onDone==='function'){
        onDone();
      }
    };

    const next=()=>{
      const key=queue.shift();

      if(!key){
        finish();
        return;
      }

      const node=play(key);

      if(node){
        node.onended=next;
      }else{
        setTimeout(next,180);
      }
    };

    next();
  }

  function resetModeFire(){
    modeFireType=null;
    modeFireShots=0;

    /*
     * 每次重置都会使旧的异步模式序列失效。
     */
    modeSequenceToken+=1;
  }

  function armModeFire(type,token){
    if(token!==modeSequenceToken) return;

    modeFireType=type;
    modeFireShots=0;
  }

  async function ensureFirstAvailable(keys){
    for(const key of keys){
      const loaded=await ensureSoundLoaded(key);

      if(loaded){
        return key;
      }
    }

    return null;
  }

  /*
   * 立即播放 enter，同时并行加载第二段模式音效。
   * enter 播放完后，确认第二段真实存在才继续播放。
   * 第二段真实播放结束后，才解锁三次 FIRE。
   */
  function startModeSequence(type,modeCandidates){
    resetModeFire();
    const token=modeSequenceToken;

    const modeKeyPromise=ensureFirstAvailable(modeCandidates);
    const enterNode=play('enter');

    const playMode=async()=>{
      if(token!==modeSequenceToken) return;

      const modeKey=await modeKeyPromise;

      if(token!==modeSequenceToken) return;

      if(!modeKey){
        console.warn(
          type==='burst'
            ? '未找到 assets/burst_mode.m4a'
            : '未找到 assets/sigle_mode.m4a'
        );
        return;
      }

      const modeNode=play(modeKey);

      if(!modeNode){
        console.warn(`${modeKey} 无法播放`);
        return;
      }

      modeNode.onended=()=>{
        armModeFire(type,token);
      };
    };

    if(enterNode){
      enterNode.onended=playMode;
    }else{
      setTimeout(playMode,180);
    }
  }

  function handleModeCode(){
    if(buf==='106'){
      /*
       * 106：enter → burst_mode。
       * 显式号码优先于变身后的普通 ENTER / ready 逻辑。
       */
      readyArmed=false;
      startModeSequence('burst',[
        'burstMode'
      ]);

      buf='';
      return true;
    }

    if(buf==='103'){
      /*
       * 103：enter → sigle_mode。
       * 文件名按用户确认的 sigle_mode 保留。
       */
      readyArmed=false;
      startModeSequence('sigle',[
        'sigleMode'
      ]);

      buf='';
      return true;
    }

    return false;
  }

  async function onModeFire(){
    if(!audioReady) return;
    if(!modeFireType) return;
    if(modeFireShots>=MODE_FIRE_MAX_SHOTS) return;

    interruptRing();

    let fireKey=null;

    if(modeFireType==='burst'){
      fireKey=await ensureFirstAvailable([
        'burstModeFire'
      ]);
    }else if(modeFireType==='sigle'){
      fireKey=await ensureFirstAvailable([
        'sigleModeFire'
      ]);
    }else{
      return;
    }

    /*
     * 音效不存在或播放失败时，不扣除射击次数。
     */
    if(!fireKey){
      console.warn(
        modeFireType==='burst'
          ? '未找到 assets/burst_mode-fire.m4a'
          : '未找到 assets/sigle_mode_fire.m4a'
      );
      return;
    }

    const fireNode=play(fireKey);

    if(!fireNode){
      console.warn(`${fireKey} 无法播放`);
      return;
    }

    modeFireShots+=1;

    /*
     * 第三次成功播放后立即锁定。
     * 必须重新输入 106 或 103 才能再次使用。
     */
    if(modeFireShots>=MODE_FIRE_MAX_SHOTS){
      modeFireType=null;
    }
  }

  function clearMusicPlaybackState(state,audio=null){
    if(audio && state.audio!==audio) return;

    if(state.fadeFrame){
      cancelAnimationFrame(state.fadeFrame);
      state.fadeFrame=null;
    }

    state.audio=null;
    state.fading=false;

  function warmMusicCache(url){
    /*
     * 音乐开始播放后，通知 Service Worker 在后台保存完整文件。
     * 这个过程不阻塞播放，也不拖慢 OPEN PHONE。
     */
    if(!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.ready
      .then((registration)=>{
        const worker=navigator.serviceWorker.controller || registration.active;

        if(worker){
          worker.postMessage({
            type:'CACHE_MEDIA',
            url:new URL(url,window.location.href).href
          });
        }
      })
      .catch(()=>{});
  }

  function prepareLongPressMusic(k){
    const state=musicButtons[k];

    if(!state || state.audio || state.preloadAudio) return;

    const audio=new Audio(state.url);

    audio.preload='auto';
    audio.playsInline=true;

    try{
      audio.load();
    }catch{}

    state.preloadAudio=audio;

    /*
     * 长按倒计时期间同步通知 Service Worker 缓存完整歌曲。
     */
    warmMusicCache(state.url);
  }

  async function startLongPressMusic(k){
    const state=musicButtons[k];

    if(!state || !audioReady || state.audio || state.fading) return;

    interruptRing();

    const audio=state.preloadAudio || new Audio(state.url);
    state.preloadAudio=null;

    audio.preload='auto';
    audio.volume=1;
    audio.loop=false;
    audio.playsInline=true;

    state.audio=audio;
    state.fading=false;

    audio.addEventListener('ended',()=>{
      clearMusicPlaybackState(state,audio);
    },{once:true});

    audio.addEventListener('error',()=>{
      console.warn(`${state.label} 加载或播放失败`);
      clearMusicPlaybackState(state,audio);
    },{once:true});

    /*
     * 后台缓存完整音乐，后续启动优先读取本地缓存。
     */
    warmMusicCache(state.url);

    try{
      await audio.play();
    }catch(error){
      console.warn(`${state.label} 无法播放：`,error);
      clearMusicPlaybackState(state,audio);
    }
  }

  function fadeOutLongPressMusic(k){
    const state=musicButtons[k];

    if(!state || !state.audio) return false;
    if(state.fading) return true;

    state.fading=true;

    const audio=state.audio;
    const startVolume=Math.max(0,audio.volume);
    const startAt=performance.now();

    const step=(now)=>{
      if(state.audio!==audio) return;

      const progress=Math.min(
        1,
        (now-startAt)/MUSIC_FADE_OUT_MS
      );

      audio.volume=Math.max(
        0,
        startVolume*(1-progress)
      );

      if(progress<1){
        state.fadeFrame=requestAnimationFrame(step);
        return;
      }

      state.fadeFrame=null;

      try{
        audio.pause();
        audio.currentTime=0;
      }catch{}

      clearMusicPlaybackState(state,audio);
    };

    state.fadeFrame=requestAnimationFrame(step);
    return true;
  }

  function onMusicButtonPointerDown(k,event){
    const state=musicButtons[k];

    if(!state) return;
    if(event.pointerType==='mouse' && event.button!==0) return;
    if(state.pointerId!==null) return;

    state.pointerId=event.pointerId;
    state.longTriggered=false;
    state.stopTriggered=false;

    try{
      event.currentTarget.setPointerCapture(event.pointerId);
    }catch{}

    /*
     * 音乐播放期间再次按同一个按钮：
     * 立刻开始淡出，这次按键不触发普通数字。
     */
    if(state.audio || state.fading){
      state.stopTriggered=true;
      fadeOutLongPressMusic(k);
      return;
    }

    if(!audioReady) return;

    /*
     * 0.5 秒长按倒计时期间提前建立流式音频并开始缓存。
     */
    prepareLongPressMusic(k);

    clearMusicPressTimer(state);

    state.timer=setTimeout(()=>{
      state.timer=null;

      if(state.pointerId!==event.pointerId) return;
      if(state.audio || state.fading) return;

      state.longTriggered=true;
      startLongPressMusic(k);
    },MUSIC_LONG_PRESS_MS);
  }

  function finishMusicButtonPointer(k,event,{cancelled=false}={}){
    const state=musicButtons[k];

    if(!state || state.pointerId!==event.pointerId) return;

    clearMusicPressTimer(state);

    const handled=state.longTriggered || state.stopTriggered;

    state.pointerId=null;
    state.longTriggered=false;
    state.stopTriggered=false;

    try{
      event.currentTarget.releasePointerCapture(event.pointerId);
    }catch{}

    if(!cancelled && !handled){
      pressDigit(k);
    }
  }

  function bindLongPressMusicButton(id,k){

    button.addEventListener('lostpointercapture',()=>{
      clearMusicPressTimer(state);
      state.pointerId=null;
      state.longTriggered=false;

    button.addEventListener('contextmenu',(event)=>{

  function canTriggerEnterLongPress(){

     * 只在变身完成且 TOP2 / TOP3 已进入 ready 待触发状态时生效。
     * 106 / 103 显式号码优先，避免长按截走模式号码。

    return (
      audioReady &&

      buf!=='106' &&
      buf!=='103'

  function onEnterPointerDown(event){

    if(!canTriggerEnterLongPress()) return;

  function finishEnterPointer(event,{cancelled=false}={}){
    if(enterPressPointerId!==event.pointerId) return;

    clearEnterPressTimer();

    const wasLongPress=enterLongPressTriggered;

    enterPressPointerId=null;
    enterLongPressTriggered=false;

    try{
      event.currentTarget.releasePointerCapture(event.pointerId);
    }catch{}

    /*
     * 没按满 1 秒：执行原有短按逻辑。

    if(!cancelled && !wasLongPress){

  function onEnter(){
    if(!audioReady) return;

    interruptRing();

    /*
     * 106 / 103 必须先判断。
     *
     * 原来的错误：
     * transformed=true 时，代码先进入普通 ENTER 分支并 return，
     * 所以只播放 enter，永远执行不到 burst_mode / sigle_mode。
     */
    if(handleModeCode()){
      return;
    }

    /*
     * 变身后新规则：
     * 1. 顶部第二个圆形按钮播放 ready，并进入待命状态。
     * 2. 再按 ENTER，按顺序播放 enter → exceed。
     * 3. 没有先按顶部第二个圆形按钮时，ENTER 只播放 enter。
     */
    if(transformed){
      if(readyArmed){
        playSequence(['enter','exceed']);
        readyArmed=false;
      }else{
        play('enter');
      }
      return;
    }

    /*
     * stand by 播放期间或播放结束后：
     * 按 ENTER 都立即进入 complete。
     *
     * 播放期间按下：
     * - 立即停止 stand by
     * - 不播放 enter
     * - 只播放 complete
     *
     * 播放结束后按下：
     * - 不播放 enter
     * - 只播放 complete
     */
    if(standByPlaying || armed){
      resetStandBy();
      resetCompleteState();

      /*
       * complete 开始播放时先锁住 TOP1。
       */
      faizSeedUnlocked=false;
      faizSeedActive=false;

      completeNode=play('complete');
      const completeBuffer=buffers.get('complete');

      if(completeNode){
        completeNode.onended=finishComplete;

        /*
         * iOS/PWA 兜底：
         * 即使 onended 延迟，也按真实音频时长完成解锁。
         */
        if(completeBuffer){
          completeTimer=setTimeout(
            finishComplete,
            Math.ceil((completeBuffer.duration+0.08)*1000)
          );
        }
      }else{
        /*
         * complete 未加载时，避免状态永久卡住。
         */
        completeTimer=setTimeout(finishComplete,380);
      }

      return;
    }

    play('enter');

    if(buf==='555'){
      resetStandBy();

      standByPlaying=true;
      standNode=play('standBy');

      const standByBuffer=buffers.get('standBy');

      if(standNode && standByBuffer){
        const duration=Math.max(0, standByBuffer.duration);

        standByEndAt=ctx().currentTime+duration;
        standNode.onended=finishStandBy;

        /*
         * iOS/PWA 兜底：
         * 即使 onended 延迟或未及时回调，
         * 音频时长结束后也会解除 ENTER 锁定。
         */
        standByTimer=setTimeout(
          finishStandBy,
          Math.ceil((duration+0.08)*1000)
        );
      }else{
        finishStandBy();
      }

      return;
    }


    if(buf.length===3 && buf!=='3821'){
      play('error');
      buf='';
      resetStandBy();
      readyArmed=false;
    }
  }

  function onStar(){

  /*
   * TOP1 Seed 模式：
   *
   * 变身完成后第一次按 TOP1：
   * - 预加载 faiz-seed 与 seed-end
   * - 播放 faiz-seed
   * - 打开 popup1
   *
   * POPUP1 已打开时再次按 TOP1：
   * - 只关闭弹窗
   * - 不触发任何逻辑或音效
   * - 不停止循环
   * - 不改变 Seed 状态
   * - 不重置次数或锁定
   *
   * seed-end 只由 BTN9 触发；
   * BTN9 同时负责结束本轮 Seed 模式。
   */
  async function onTop1(){
    /*
     * 必须先取得元素引用。
     *
     * v54 在声明 popup1 之前就访问 popup1.classList，
     * 会触发 ReferenceError，导致 TOP1 的全部逻辑中断。
     */
    const popup1=document.getElementById('popup1');
    const popup4=document.getElementById('popup4');

    /*
     * 只要 POPUP1 当前打开，再按 TOP1 就只关闭弹窗。
     *
     * 这个判断必须位于整个函数最前面：
     * BTN9 会结束 Seed 模式，但仍保持 POPUP1 打开。
     * 此时按 TOP1 不能误走“第一次点击”并重播 faiz-seed。
     */
    if(popup1.classList.contains('show')){
      popup1.classList.remove('show');
      return;
    }

    if(!audioReady) return;
    if(!faizSeedUnlocked) return;
    if(seedEndPlaying) return;
    if(faizSeedLoading) return;

    /*
     * 移动端 PWA 可能会在页面切换或停留后暂停 AudioContext。
     * TOP1 是明确的用户点击，因此这里主动恢复音频上下文。
     */
    const audioContext=ctx();

    if(audioContext.state==='suspended'){
      try{
        await audioContext.resume();
      }catch(error){
        console.warn('AudioContext 恢复失败：',error);
      }
    }

    interruptRing();

    /*
     * 第一次按 TOP1：
     * 同时准备 faiz-seed 和 seed-end。
     *
     * 这样第二次按 TOP1 时 seed-end 已经在 AudioBuffer 中，
     * 不需要在用户点击后再等待 fetch / decode。
     */
    if(!faizSeedActive){
      startTop1RouteAudioPreload();
      faizSeedLoading=true;
      popup1SoundSessionToken+=1;
      stopKickSequence({resetCount:true});
      resetPopup1SoundButtonLocks();

      try{
        const [faizSeedLoaded,seedEndLoaded]=await Promise.all([
          ensureSoundLoaded('faizSeed'),
          ensureSoundLoaded('seedEnd')
        ]);

        if(!faizSeedLoaded){
          console.warn('未找到 assets/faiz-seed.m4a');
          return;
        }

        if(!seedEndLoaded){
          console.warn('未找到 assets/seed-end.m4a');
          return;
        }

        const seedNode=play('faizSeed');

        if(!seedNode){
          console.warn('faiz-seed 无法播放');
          return;
        }

        popup4.classList.remove('show');
        popup1.classList.add('show');
        faizSeedActive=true;

        /*
         * 用户已经进入 POPUP1，再准备 BTN3～BTN8 专用音效；BTN9 使用已加载的 seed-end。
         */
        startPopup1AudioPreload();
      }finally{
        faizSeedLoading=false;
      }

      return;
    }

    /*
     * Seed 模式仍然开启但 POPUP1 已关闭时，
     * 再按 TOP1 不执行任何逻辑或音效。
     *
     * 不重新打开弹窗，也不重复播放 faiz-seed。
     */
    return;
  }

    setPct(document.getElementById('btnKey1'),
      '--key1-left','--key1-top','--key1-w','--key1-h');

    setPct(document.getElementById('btnKey2'),
      '--key2-left','--key2-top','--key2-w','--key2-h');

    setPct(document.getElementById('btnKey3'),
      '--key3-left','--key3-top','--key3-w','--key3-h');

    setPct(document.getElementById('btnKey4'),
      '--key4-left','--key4-top','--key4-w','--key4-h');

    setPct(document.getElementById('btnKey5'),
      '--key5-left','--key5-top','--key5-w','--key5-h');

    setPct(document.getElementById('btnKey6'),
      '--key6-left','--key6-top','--key6-w','--key6-h');

    setPct(document.getElementById('btnKey7'),
      '--key7-left','--key7-top','--key7-w','--key7-h');

    setPct(document.getElementById('btnKey8'),
      '--key8-left','--key8-top','--key8-w','--key8-h');

    setPct(document.getElementById('btnKey9'),
      '--key9-left','--key9-top','--key9-w','--key9-h');

    setPct(document.getElementById('btnStar'),
      '--star-left','--star-top','--star-w','--star-h');

    setPct(document.getElementById('btnKey0'),
      '--key0-left','--key0-top','--key0-w','--key0-h');

    setPct(document.getElementById('btnHash'),
      '--hash-left','--hash-top','--hash-w','--hash-h');

    function pct(varName){
      return parseFloat(css.getPropertyValue(varName)) || 0;
    }

    /*
     * TOP1 弹框自适应布局：
     *
     * 第一排：BTN1、BTN2、BTN3
     * 第二排：BTN4、BTN5、BTN6
     * 第三排：BTN7、BTN8、BTN9
     *
     * 所有按钮使用同一个 diameter，
     * BTN1～BTN9 的实际像素大小完全一致。
     */
    function placePopup1Grid(){
      const phone=document.getElementById('phone');
      const popup=document.getElementById('popup1');

      const phoneWidth=phone.clientWidth;
      const phoneHeight=phone.clientHeight;

      if(!phoneWidth || !phoneHeight) return;

      const popupLeft=
        phoneWidth*pct('--popup1-left')/100;

      const popupTop=
        phoneHeight*pct('--popup1-top')/100;

      const popupWidth=
        phoneWidth*pct('--popup1-w')/100;

      const diameter=
        popupWidth*pct('--popup1-grid-btn-size')/100;

      const topPadding=
        diameter*pct('--popup1-grid-top-padding')/100;

      const rowGap=
        diameter*pct('--popup1-grid-row-gap')/100;

      const bottomPadding=
        diameter*pct('--popup1-grid-bottom-padding')/100;

      const popupHeight=
        topPadding
        +(diameter*3)
        +(rowGap*2)
        +bottomPadding;

      popup.style.left=`${popupLeft}px`;
      popup.style.top=`${popupTop}px`;
      popup.style.width=`${popupWidth}px`;
      popup.style.height=`${popupHeight}px`;

      const col1=
        popupWidth*pct('--popup1-grid-col1-left')/100;

      const col2=
        popupWidth*pct('--popup1-grid-col2-left')/100;

      const col3=
        popupWidth*pct('--popup1-grid-col3-left')/100;

      const row1Top=topPadding;
      const row2Top=row1Top+diameter+rowGap;
      const row3Top=row2Top+diameter+rowGap;

      const positions=[
        [1,col1,row1Top],
        [2,col2,row1Top],
        [3,col3,row1Top],

        [4,col1,row2Top],
        [5,col2,row2Top],
        [6,col3,row2Top],

        [7,col1,row3Top],
        [8,col2,row3Top],
        [9,col3,row3Top]
      ];

      positions.forEach(
        ([buttonNumber,left,top])=>{
          const button=
            document.getElementById(
              `popup1Btn${buttonNumber}`
            );

          button.style.left=`${left}px`;
          button.style.top=`${top}px`;
          button.style.width=`${diameter}px`;
          button.style.height=`${diameter}px`;
        }
      );
    }

    function setPct(el, l,t,w,h){
      setRectPct(el, pct(l), pct(t), pct(w), pct(h));
    }

    function setRectPct(el, l,t,w,h){
      el.style.left = l + '%';
      el.style.top  = t + '%';
      el.style.width  = w + '%';
      el.style.height = h + '%';
    }
  }
  window.addEventListener('load', place);
  window.addEventListener('resize', place);
})();
</script>

<script>
/*
 * 新版 Service Worker 接管后自动刷新一次，
 * 确保页面不再继续由 v45 / v46 的旧 worker 控制。
 */
if ("serviceWorker" in navigator) {
  const SW_RELOAD_KEY='faiz_sw_v59_reloaded';

  navigator.serviceWorker.addEventListener(
    'controllerchange',
    ()=>{
      if(sessionStorage.getItem(SW_RELOAD_KEY)==='1'){
        return;
      }

      sessionStorage.setItem(SW_RELOAD_KEY,'1');
      window.location.reload();
    }
  );

  window.addEventListener("load", async() => {
    try{
      const registration=
        await navigator.serviceWorker.register(
          "./sw.js?v=59",
          {updateViaCache:"none"}
        );

      await registration.update();
    }catch(error){
      console.error("Service Worker 注册失败：",error);
    }
  });
}
</script>
