<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FAIZ" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>FAIZ Phone (调尺寸版)</title>
<style>
  :root{
    --ui: url('assets/ui.jpg');

    /* ↓↓↓ 按钮整体更小：只要微调这几个百分比即可 ↓↓↓ */
    --enter-left: 28%;   /* ENTER 左边距（%） */
    --enter-top:  52.6%; /* ENTER 顶部（%）   */
    --enter-w:    23%;   /* ENTER 宽度（%）   */
    --enter-h:    4%;  /* ENTER 高度（%）   */

    /* =====================================================
       ENTER 下方 15 个按钮：每个按钮都可单独调整
       left = 左右位置；top = 上下位置；w = 宽度；h = 高度
       ===================================================== */

    /* 铃声 */
    --ring-left: 28%;
    --ring-top:  59%;
    --ring-w:    14%;
    --ring-h:    4.5%;

    /* クリア */
    --clear-left: 46%;
    --clear-top:  59%;
    --clear-w:    14%;
    --clear-h:    4.5%;

    /* 停止 */
    --stop-left: 64%;
    --stop-top:  59%;
    --stop-w:    14%;
    --stop-h:    4.5%;

    /* 数字 1 */
    --key1-left: 28%;
    --key1-top:  64.8%;
    --key1-w:    14%;
    --key1-h:    4.5%;

    /* 数字 2 */
    --key2-left: 46%;
    --key2-top:  64.8%;
    --key2-w:    14%;
    --key2-h:    4.5%;

    /* 数字 3 */
    --key3-left: 64%;
    --key3-top:  64.8%;
    --key3-w:    14%;
    --key3-h:    4.5%;

    /* 数字 4 */
    --key4-left: 28%;
    --key4-top:  70.6%;
    --key4-w:    14%;
    --key4-h:    4.5%;

    /* 数字 5 */
    --key5-left: 46%;
    --key5-top:  70.6%;
    --key5-w:    14%;
    --key5-h:    4.5%;

    /* 数字 6 */
    --key6-left: 64%;
    --key6-top:  70.6%;
    --key6-w:    14%;
    --key6-h:    4.5%;

    /* 数字 7 */
    --key7-left: 28%;
    --key7-top:  76.4%;
    --key7-w:    14%;
    --key7-h:    4.5%;

    /* 数字 8 */
    --key8-left: 46%;
    --key8-top:  76.4%;
    --key8-w:    14%;
    --key8-h:    4.5%;

    /* 数字 9 */
    --key9-left: 64%;
    --key9-top:  76.4%;
    --key9-w:    14%;
    --key9-h:    4.5%;

    /* 星号 */
    --star-left: 28%;
    --star-top:  82.2%;
    --star-w:    14%;
    --star-h:    4.5%;

    /* 数字 0 */
    --key0-left: 46%;
    --key0-top:  82.2%;
    --key0-w:    14%;
    --key0-h:    4.5%;

    /* 井号 */
    --hash-left: 64%;
    --hash-top:  82.2%;
    --hash-w:    14%;
    --hash-h:    4.5%;


    /* ===== FAIZ 顶部两个圆形按钮 ===== */
    --btn-top1-left: 6%;
    --btn-top1-top:  4%;
    --btn-top1-w:    18%;
    --btn-top1-h:    9%;

    /* TOP1 下方新增圆形按钮 */
    --btn-top1b-left: 6%;
    --btn-top1b-top:  14%;
    --btn-top1b-w:    18%;
    --btn-top1b-h:    9%;

    --btn-top2-left: 29%;
    --btn-top2-top:  4%;
    --btn-top2-w:    18%;
    --btn-top2-h:    9%;

    --btn-top3-left: 52%;
    --btn-top3-top:  4%;
    --btn-top3-w:    18%;
    --btn-top3-h:    9%;

    --btn-top4-left: 75%;
    --btn-top4-top:  4%;
    --btn-top4-w:    18%;
    --btn-top4-h:    9%;

    /* 第四个按钮对应弹框，与第一个弹框同尺寸 */
    --popup4-left: 6%;
    --popup4-top:  15%;
    --popup4-w:    88%;
    --popup4-h:    25%;

    /* ===== 第一层弹框：与 KAIXA 同尺寸 ===== */
    --popup1-left: 6%;
    --popup1-top:  15%;
    --popup1-w:    88%;
    --popup1-h:    25%;

    --bg:#000; --fg:#fff;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg); }
  body{ display:flex; justify-content:center; }
  .wrap{ width:min(94vw, 520px); margin:12px auto 48px; }

  .phone{ position:relative; width:100%; }
  .phone img{ width:100%; height:auto; display:block; user-select:none; pointer-events:none; }

  .hit{
    position:absolute; border:none; outline:none; background:transparent;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    transform-origin:center;
  }
  .hit:active{ transform:scale(.98); }


  .hit.circle{
    border-radius:999px;
  }

  .popup{
    position:absolute;
    z-index:50;
    display:none;
    background:rgba(0,0,0,.6);
    border:1.5px dashed #00ffff;
    border-radius:12px;
  }

  .popup.show{
    display:block;
  }

  .popup::after{
    content:attr(data-label);
    position:absolute;
    left:8px;
    top:6px;
    font:600 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    color:#00ffff;
    text-shadow:0 0 3px #000;
    pointer-events:none;
  }

  /* ===== 调试描边：对齐OK后，把这两段注释掉即可 ===== */
  .hit{ background:rgba(255,0,0,.22); border:1.5px dashed #00ffff; border-radius:8px; }
  .hit::after{
    content: attr(aria-label);
    position:absolute; left:4px; top:2px; font: 600 10px/1 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color:#00ffff; text-shadow:0 0 3px #000; pointer-events:none;
  }
  /* =============================================== */

  /* 左下角开机音按钮 */
  .open-phone-btn{
    position:fixed;
    left:calc(14px + env(safe-area-inset-left));
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:9999;
    min-width:92px;
    height:44px;
    padding:0 14px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:12px;
    background:rgba(0,0,0,.78);
    color:#fff;
    font:700 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    letter-spacing:.5px;
    box-shadow:0 4px 16px rgba(0,0,0,.38);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .open-phone-btn:active{
    transform:scale(.96);
  }

</style>
</head>
<body>
  <button class="open-phone-btn" id="btnOpenPhone" type="button" aria-label="播放开机音">OPEN PHONE</button>
  <div class="wrap">
    <div class="phone" id="phone">
      <img src="assets/ui.jpg" alt="FAIZ UI" id="ui"/>


      <!-- 顶部第一个圆形按钮：打开第一层弹框 -->
      <button class="hit circle" id="btnTop1" aria-label="TOP1"></button>


      <!-- TOP1 正下方新增圆形按钮：暂未绑定交互 -->
      <button class="hit circle" id="btnTop1B" aria-label="TOP1-B"></button>

      <!-- 顶部第二个圆形按钮：变身后播放 READY -->
      <button class="hit circle" id="btnTop2" aria-label="TOP2"></button>


      <!-- 顶部第三个圆形按钮：交互与第二个按钮完全相同 -->
      <button class="hit circle" id="btnTop3" aria-label="TOP3"></button>


      <!-- 顶部第四个圆形按钮：打开第二个弹框 -->
      <button class="hit circle" id="btnTop4" aria-label="TOP4"></button>

      <!-- 第四个圆形按钮对应弹框 -->
      <div class="popup" id="popup4" data-label="POPUP4"></div>

      <!-- 第一层弹框：只保留空弹框，不放 KAIXA 的功能图标 -->
      <div class="popup" id="popup1" data-label="POPUP1"></div>

      <!-- ENTER -->
      <button class="hit" id="btnEnter" aria-label="ENTER"></button>

      <!-- 第二行：铃声 / クリア / 停止 -->
      <button class="hit" id="btnRing"  aria-label="铃声"></button>
      <button class="hit" id="btnClear" aria-label="クリア"></button>
      <button class="hit" id="btnStop"  aria-label="停止"></button>

      <!-- 数字键 1~9、*0# -->
      <button class="hit" id="btnKey1" data-k="1" aria-label="1"></button>
      <button class="hit" id="btnKey2" data-k="2" aria-label="2"></button>
      <button class="hit" id="btnKey3" data-k="3" aria-label="3"></button>

      <button class="hit" id="btnKey4" data-k="4" aria-label="4"></button>
      <button class="hit" id="btnKey5" data-k="5" aria-label="5"></button>
      <button class="hit" id="btnKey6" data-k="6" aria-label="6"></button>

      <button class="hit" id="btnKey7" data-k="7" aria-label="7"></button>
      <button class="hit" id="btnKey8" data-k="8" aria-label="8"></button>
      <button class="hit" id="btnKey9" data-k="9" aria-label="9"></button>

      <button class="hit" id="btnStar" data-k="*" aria-label="*"></button>
      <button class="hit" id="btnKey0" data-k="0" aria-label="0"></button>
      <button class="hit" id="btnHash" data-k="#" aria-label="#"></button>
    </div>
  </div>

<script>
(() => {
  /* ------------ 资源（自动匹配 .m4a/.mp3/.wav/.mp4） ------------ */
  const BASE = {
    openPhone: 'assets/open phone',
    ring:      'assets/ring',
    enter:     'assets/enter',
    key1:      'assets/key1',
    key5_2:    'assets/key5_2',
    key5_3:    'assets/key5_3',
    standBy:   'assets/stand by',
    complete:  'assets/complete',
    error:     'assets/error',
    ready:     'assets/ready',
    exceed:    'assets/exceed charge',
    release:   'assets/release',
    combo3821: 'assets/3821',
    weaponHit: 'assets/weaponHit',
    faizSeed:  'assets/faiz-seed'
  };
  const EXT = ['.m4a','.mp3','.wav','.mp4'];
  const urlMap = {};

  let ac=null, master=null;
  const buffers=new Map();
  function ctx(){ if(ac) return ac; const C=window.AudioContext||window.webkitAudioContext; ac=new C({latencyHint:'interactive'}); master=ac.createGain(); master.gain.value=1; master.connect(ac.destination); return ac; }
  async function resolveUrl(base){
    if(urlMap[base]) return urlMap[base];
    for(const ext of EXT){
      const u = `${base}${ext}`;
      try{ const r = await fetch(u,{method:'HEAD',cache:'no-store'}); if(r.ok){ urlMap[base]=u; return u; } }catch{}
    }
    return null;
  }
  async function load(key){
    if(buffers.has(key)) return buffers.get(key);
    const url = await resolveUrl(BASE[key]); if(!url) return null;
    const res = await fetch(url,{cache:'no-store'}); if(!res.ok) return null;
    const arr = await res.arrayBuffer();
    const b = await ctx().decodeAudioData(arr);
    buffers.set(key,b); return b;
  }
  function play(key,{loop=false}={}){ const b=buffers.get(key); if(!b) return null; const s=ctx().createBufferSource(); s.buffer=b; s.loop=!!loop; s.connect(master); s.start(); return s; }
  function stop(n){ if(n&&n.stop){ try{n.stop();}catch{} } }

  /* ------------ 规则/状态 ------------ */
  const COMBOS=['555','106','103'];

  let buf='';
  let transformed=false;
  let armed=false;
  let standByPlaying=false;
  let standByEndAt=0;
  let standByTimer=null;
  let readyArmed=false;

  /*
   * TOP1 的 FAIZ Seed 两段式状态：
   * complete 播放结束后才解锁。
   * 第一次 TOP1：faiz-seed。
   * 第二次 TOP1：预留结束音效逻辑。
   */
  let faizSeedUnlocked=false;
  let faizSeedActive=false;

  /*
   * 结束音效名称暂未确定。
   * 之后确定名称时，只需要：
   * 1. 在 BASE 中加入结束音效资源；
   * 2. 把这里改成对应的 BASE 键名。
   */
  const FAIZ_SEED_END_KEY=null;

  let ringNode=null;
  let standNode=null;

  /*
   * 缓存加载方式与 KAIXA 一致：
   * 必须先点击左下角 OPEN PHONE，
   * 一次性加载 FAIZ 自己的全部音效。
   *
   * 注意：这里只复用缓存加载方式，
   * 不复制 KAIXA 的任何模式音效或交互规则。
   */
  let audioReady=false;
  let audioLoading=false;

  function stageOf(s){
    for(const c of COMBOS){
      if(c.startsWith(s)) return s.length;
    }
    return 0;
  }

  function interruptRing(){
    if(ringNode){
      stop(ringNode);
      ringNode=null;
    }
  }


  function finishStandBy(){
    if(standByTimer){
      clearTimeout(standByTimer);
      standByTimer=null;
    }

    standNode=null;
    standByEndAt=0;
    standByPlaying=false;
    armed=true;
  }

  function resetStandBy(){
    if(standByTimer){
      clearTimeout(standByTimer);
      standByTimer=null;
    }

    if(standNode){
      standNode.onended=null;
      stop(standNode);
      standNode=null;
    }

    standByEndAt=0;
    standByPlaying=false;
    armed=false;
  }

  async function ensureReady(){
    const c=ctx();

    try{
      if(c.state==='suspended') await c.resume();
    }catch{}

    if(audioReady) return true;
    if(audioLoading) return false;

    audioLoading=true;

    const openButton=document.getElementById('btnOpenPhone');
    const oldText=openButton.textContent;
    openButton.textContent='LOADING…';
    openButton.disabled=true;

    try{
      await Promise.all(
        Object.keys(BASE).map(k=>load(k).catch(()=>null))
      );

      audioReady=true;
      return true;
    }finally{
      audioLoading=false;
      openButton.textContent=oldText;
      openButton.disabled=false;
    }
  }

  async function onOpenPhone(){
    const ok=await ensureReady();
    if(!ok && !audioReady) return;

    interruptRing();
    play('openPhone');
  }

  function playSequence(keys){
    const queue=[...keys];

    const next=()=>{
      const key=queue.shift();
      if(!key) return;

      const node=play(key);

      if(queue.length===0) return;

      if(node){
        node.onended=next;
      }else{
        setTimeout(next,180);
      }
    };

    next();
  }

  function pressDigit(k){
    if(!audioReady) return;

    interruptRing();

    const s=(buf+k).slice(-3);
    const stage=stageOf(s);

    if(stage===1) play('key1');
    else if(stage===2) play('key5_2');
    else if(stage===3) play('key5_3');
    else play('key1');

    buf=s;

    if(buf==='3821'){
      play('combo3821');
    }
  }

  function onEnter(){
    if(!audioReady) return;

    interruptRing();

    /*
     * 变身后新规则：
     * 1. 顶部第二个圆形按钮播放 ready，并进入待命状态。
     * 2. 再按 ENTER，按顺序播放 enter → exceed。
     * 3. 没有先按顶部第二个圆形按钮时，ENTER 只播放 enter。
     */
    if(transformed){
      if(readyArmed){
        playSequence(['enter','exceed']);
        readyArmed=false;
      }else{
        play('enter');
      }
      return;
    }

    /*
     * stand by 播放期间或播放结束后：
     * 按 ENTER 都立即进入 complete。
     *
     * 播放期间按下：
     * - 立即停止 stand by
     * - 不播放 enter
     * - 只播放 complete
     *
     * 播放结束后按下：
     * - 不播放 enter
     * - 只播放 complete
     */
    if(standByPlaying || armed){
      resetStandBy();

      const s=play('complete');

      const done=()=>{
        transformed=true;
        readyArmed=false;

        /* complete 完整播放结束后，才允许 TOP1 触发 faiz-seed */
        faizSeedUnlocked=true;
        faizSeedActive=false;

        resetStandBy();
        buf='';
      };

      if(s) s.onended=done;
      else setTimeout(done,380);

      return;
    }

    play('enter');

    if(buf==='555'){
      resetStandBy();

      standByPlaying=true;
      standNode=play('standBy');

      const standByBuffer=buffers.get('standBy');

      if(standNode && standByBuffer){
        const duration=Math.max(0, standByBuffer.duration);

        standByEndAt=ctx().currentTime+duration;
        standNode.onended=finishStandBy;

        /*
         * iOS/PWA 兜底：
         * 即使 onended 延迟或未及时回调，
         * 音频时长结束后也会解除 ENTER 锁定。
         */
        standByTimer=setTimeout(
          finishStandBy,
          Math.ceil((duration+0.08)*1000)
        );
      }else{
        finishStandBy();
      }

      return;
    }

    if(buf==='106'||buf==='103'){
      return;
    }

    if(buf.length===3 && buf!=='3821'){
      play('error');
      buf='';
      resetStandBy();
      readyArmed=false;
    }
  }

  function onStar(){
    if(!audioReady) return;

    interruptRing();

    if(transformed) play('weaponHit');
    else play('key1');

    buf=(buf+'*').slice(-3);
  }

  function ringStart(){
    if(!audioReady) return;

    interruptRing();
    ringNode=play('ring',{loop:true});
  }

  function ringStop(){
    if(!audioReady) return;
    interruptRing();
  }

  function onClear(){
    if(!audioReady) return;

    interruptRing();

    if(!transformed){
      play('key1');
      buf='';
      return;
    }

    play('key1');

    const s=play('release');

    const done=()=>{
      transformed=false;
      resetStandBy();
      readyArmed=false;

      /* 解除变身后，TOP1 的 Seed 状态重新锁定 */
      faizSeedUnlocked=false;
      faizSeedActive=false;

      buf='';
    };

    if(s) s.onended=done;
    else done();
  }

  /*
   * FAIZ Seed 结束音效预留函数。
   * 目前结束音效尚未命名，所以第二次点击只完成状态切换，
   * 不会请求不存在的音频文件。
   */
  function playFaizSeedEnd(){
    if(!FAIZ_SEED_END_KEY) return;
    play(FAIZ_SEED_END_KEY);
  }

  /*
   * TOP1：
   * 1. 保留原来的弹框开关。
   * 2. complete 播放结束后才启用音效。
   * 3. 第一次点击播放 faiz-seed。
   * 4. 第二次点击触发预留的结束音效逻辑。
   */
  function onTop1(){
    const popup1=document.getElementById('popup1');
    const popup4=document.getElementById('popup4');

    popup4.classList.remove('show');
    popup1.classList.toggle('show');

    if(!audioReady) return;
    if(!faizSeedUnlocked) return;

    interruptRing();

    if(!faizSeedActive){
      play('faizSeed');
      faizSeedActive=true;
      return;
    }

    playFaizSeedEnd();
    faizSeedActive=false;
  }

  /* 第四个圆形按钮：打开/关闭第二个弹框 */
  function togglePopup4(){
    const popup1=document.getElementById('popup1');
    const popup4=document.getElementById('popup4');

    popup1.classList.remove('show');
    popup4.classList.toggle('show');
  }

  /* 第二、第三个圆形按钮：仅在 FAIZ 变身后播放 ready */
  function onTop2Ready(){
    if(!audioReady) return;
    if(!transformed) return;

    interruptRing();
    play('ready');
    readyArmed=true;
  }

  /* ------------ 绑定 ------------ */
  document.getElementById('btnTop1').addEventListener('click', onTop1);
  document.getElementById('btnTop2').addEventListener('click', onTop2Ready);
  document.getElementById('btnTop3').addEventListener('click', onTop2Ready);
  document.getElementById('btnTop4').addEventListener('click', togglePopup4);

  document.querySelectorAll('.hit[data-k]').forEach(b=>{
    const k=b.dataset.k;
    if(k==='*') b.addEventListener('click', onStar);
    else        b.addEventListener('click', ()=>pressDigit(k));
  });
  document.getElementById('btnOpenPhone').addEventListener('click', onOpenPhone);
  document.getElementById('btnEnter').addEventListener('click', onEnter);
  document.getElementById('btnRing').addEventListener('click', ringStart);
  document.getElementById('btnStop').addEventListener('click', ringStop);
  document.getElementById('btnClear').addEventListener('click', onClear);

  /* ------------ 位置：按百分比摆放（本次已整体缩小） ------------ */
  function place(){
    const css = getComputedStyle(document.documentElement);

    setRectPct(
      document.getElementById('btnTop1'),
      pct('--btn-top1-left'),
      pct('--btn-top1-top'),
      pct('--btn-top1-w'),
      pct('--btn-top1-h')
    );


    setRectPct(
      document.getElementById('btnTop1B'),
      pct('--btn-top1b-left'),
      pct('--btn-top1b-top'),
      pct('--btn-top1b-w'),
      pct('--btn-top1b-h')
    );

    setRectPct(
      document.getElementById('btnTop2'),
      pct('--btn-top2-left'),
      pct('--btn-top2-top'),
      pct('--btn-top2-w'),
      pct('--btn-top2-h')
    );


    setRectPct(
      document.getElementById('btnTop3'),

    function pct(varName){ return parseFloat(css.getPropertyValue(varName)) || 0; }
    function setPct(el, l,t,w,h){ setRectPct(el, pct(l), pct(t), pct(w), pct(h)); }
    function setRectPct(el, l,t,w,h){
      el.style.left = l + '%';
      el.style.top  = t + '%';
      el.style.width  = w + '%';
      el.style.height = h + '%';
    }
